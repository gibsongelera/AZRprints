<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#020617"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/printport.css"/>
</head>

<body>
<div class="app-shell">
<aside id="appSidebar" class="app-sidebar">
  <div class="p-3 border-bottom border-light border-opacity-25">
    <a href="dashboard.html" class="text-white text-decoration-none d-flex align-items-center gap-2">
      <span class="brand-logo"><img src="../assets/azr-prints-logo.png" alt="AZR PRINT'S" class="brand-logo-img"/></span>
      <div>
        <div class="brand-title fw-bold" data-brand-name>AZR PRINT'S</div>
        <small class="text-white-50" data-brand-tagline>Admin Portal</small>
      </div>
    </a>
  </div>
  <nav class="nav flex-column py-2">
    <a class="nav-link" href="dashboard.html" data-nav-link><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a class="nav-link" href="orders.html" data-nav-link><i class="bi bi-receipt"></i> Manage Orders</a>
    <a class="nav-link" href="users.html" data-nav-link><i class="bi bi-people"></i> Manage Users</a>
    <a class="nav-link" href="payments.html" data-nav-link><i class="bi bi-credit-card"></i> Edit Payments</a>
    <a class="nav-link" href="notifications.html" data-nav-link><i class="bi bi-bell"></i> Notifications</a>
    <a class="nav-link" href="settings.html" data-nav-link><i class="bi bi-gear"></i> Settings</a>
    <a class="nav-link" href="profile.html" data-nav-link><i class="bi bi-person-circle"></i> Profile</a>
    <a class="nav-link mt-2" href="#" data-logout><i class="bi bi-box-arrow-right"></i> Logout</a>
  </nav>
</aside>
<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<div class="app-main">
<header class="app-topbar d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center gap-3">
    <button type="button" class="btn btn-light d-lg-none" id="sidebarToggle" aria-label="Menu"><i class="bi bi-list fs-4"></i></button>
    <h1 class="h5 mb-0 fw-semibold text-primary-dark">Dashboard</h1>
  </div>
  <div class="d-flex align-items-center gap-2">
    <button type="button" class="btn btn-light btn-sm" data-header-nav="notifications.html" title="Notifications"><i class="bi bi-bell"></i></button>
    <button type="button" class="btn btn-light btn-sm" data-header-nav="settings.html" title="Settings"><i class="bi bi-gear"></i></button>
    <span class="d-none d-sm-inline text-muted small" data-session-name>Admin</span>
    <span class="badge rounded-pill bg-primary" data-session-initials>AD</span>
  </div>
</header>

<main class="app-content">

<div class="row g-3 mb-4" id="adminStats"></div>
<div class="row g-4">
  <div class="col-lg-8"><div class="card"><div class="card-header fw-semibold">Recent Orders</div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Order</th><th>Student</th><th>Amount</th><th>Status</th></tr></thead><tbody id="recentOrders"></tbody></table></div></div></div></div>
  <div class="col-lg-4"><div class="card"><div class="card-header fw-semibold">Quick Credit Top-Up</div><div class="card-body">
    <label class="form-label">Student ID</label><input class="form-control mb-2" id="topupId" placeholder="ZPPSU-2024-0145"/>
    <label class="form-label">Amount (₱)</label><input class="form-control mb-3" id="topupAmount" type="number" min="1" step="0.01"/>
    <button class="btn btn-primary w-100" id="topupBtn">Add Credits</button>
  </div></div></div>
</div>
</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/seed.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/auth.js"></script>
    <script>PrintPortAuth.requireRole('admin');</script><script src="../js/pages/admin-dashboard.js"></script>
  <script src="../js/branding.js"></script>
  <script src="../js/app.js"></script>

</div>
</div>
</body>
</html>
